# ============================================
# 🗄️ ALEMBIC.INI — Larizinha Store
# ============================================
# Configuração do Alembic (migrations do banco).
#
# ⚠️ CRÍTICO:
#   Todas as linhas de configuração do Alembic
#   PRECISAM estar dentro da seção [alembic].
#   Sem isso, dá erro "File contains no section headers".
#
# ⚠️ A URL do banco NÃO fica aqui.
# Ela é carregada de core.config no migrations/env.py.
# ============================================


# --------------------------------------------
# 🧭 CONFIGURAÇÃO PRINCIPAL
# --------------------------------------------
[alembic]

# Onde ficam as migrations geradas
script_location = migrations

# Prefixo do arquivo de versão (deixamos vazio)
# version_locations =

# Codificação dos arquivos gerados
output_encoding = utf-8

# Template de nome dos arquivos de migration
# {revision} e {slug} são substituídos automaticamente
# Ex: a1b2c3d4_add_users_table.py
file_template = %%(rev)s_%%(slug)s

# Fuso horário pra timestamp das migrations
timezone = America/Sao_Paulo

# URL do banco (DEIXA VAZIO — o env.py carrega do .env)
sqlalchemy.url =

# Separador de path (os = auto-detecta)
version_path_separator = os


# ============================================
# 📝 LOGS — GERAL
# ============================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic


# ============================================
# 🖨️ HANDLER — CONSOLE
# ============================================
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


# ============================================
# 🎨 FORMATADOR DE LOG
# ============================================
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S


# ============================================
# 🔧 PÓS-PROCESSAMENTO (opcional)
# ============================================
# Descomente se quiser formatar automaticamente:
#
# [post_write_hooks]
# hooks = black,isort
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME
# isort.type = console_scripts
# isort.entrypoint = isort
# isort.options = --profile black REVISION_SCRIPT_FILENAME
