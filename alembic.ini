# ============================================
# 🗄️ ALEMBIC.INI — Larizinha Store
# ============================================
# Configuração do Alembic (migrations do banco).
#
# O que é Alembic?
#   Ferramenta que versiona o banco de dados.
#   Cada alteração (nova tabela, nova coluna) vira
#   um "script de migration" que pode ser aplicado
#   sem perder dados.
#
# Comandos principais:
#   alembic revision --autogenerate -m "mensagem"
#     → cria um novo script baseado nos models
#
#   alembic upgrade head
#     → aplica todas as migrations pendentes
#
#   alembic downgrade -1
#     → desfaz a última migration
#
#   alembic current
#     → mostra qual migration está aplicada
#
#   alembic history
#     → lista todas as migrations
#
# ⚠️ A URL do banco NÃO fica aqui.
# Ela é carregada de core.config no env.py.
# ============================================


# --------------------------------------------
# 🧭 CAMINHO DOS SCRIPTS
# --------------------------------------------
# Onde ficam as migrations geradas
script_location = migrations

# Prefixo do arquivo de versão (padrão: nada)
# Ex: se colocar "v", gera "v_abc123_...py"
# Deixamos vazio pro padrão do Alembic
version_path_separator = os

# Codificação dos arquivos gerados
# (importante: alguns sistemas geram em ASCII e quebram acentos)
output_encoding = utf-8


# --------------------------------------------
# 🗄️ URL DO BANCO
# --------------------------------------------
# DEIXE VAZIO. A URL real é carregada dinamicamente
# no arquivo migrations/env.py a partir do core.config.
#
# Isso evita colocar credenciais neste arquivo.
# O env.py vai ler DATABASE_URL e sobrescrever aqui.
# --------------------------------------------
sqlalchemy.url =


# --------------------------------------------
# 📝 LOGS — GERAL
# --------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic


# --------------------------------------------
# 🖨️ HANDLER — CONSOLE
# --------------------------------------------
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


# --------------------------------------------
# 🎨 FORMATADOR DE LOG
# --------------------------------------------
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S


# ============================================
# ⚙️ CONFIGURAÇÕES DE GERAÇÃO
# ============================================
# Formato do nome dos arquivos de migration.
#
# Padrão: {revision}_{slug}
# Ex: a1b2c3d4_add_users_table.py
#
# Vantagens:
#   - Ordenável
#   - Legível
#   - Fácil de buscar
# ============================================
file_template = %%(rev)s_%%(slug)s


# ============================================
# 🕐 FUSO HORÁRIO
# ============================================
# Usa o fuso do sistema para timestamp das migrations
timezone = America/Sao_Paulo


# ============================================
# 📁 DIRETÓRIO DE VERSÕES
# ============================================
# Onde ficam os arquivos de migration.
# Padrão: migrations/versions/
# ============================================
# (Não precisa configurar aqui — o env.py cuida disso)


# ============================================
# 🔧 PÓS-PROCESSAMENTO
# ============================================
# Hooks que rodam depois de gerar um arquivo.
# Vamos usar pra formatar automaticamente.
#
# Descomente se quiser usar Black e isort:
#
# [post_write_hooks]
# hooks = black,isort
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME
# isort.type = console_scripts
# isort.entrypoint = isort
# isort.options = --profile black REVISION_SCRIPT_FILENAME
# ============================================


# ============================================
# 📌 OBSERVAÇÕES IMPORTANTES
# ============================================
# 1. Este arquivo NÃO contém senha nem token.
#    A URL do banco é lida no env.py.
#
# 2. Sempre que rodar "alembic upgrade head",
#    o Alembic aplica as migrations pendentes
#    na ordem correta.
#
# 3. NUNCA edite uma migration já aplicada em
#    produção. Crie uma nova pra corrigir.
#
# 4. No Render, o comando "alembic upgrade head"
#    roda automaticamente no deploy (configuraremos
#    no render.yaml depois).
# ============================================

# ============================================
# FIM
# ============================================
